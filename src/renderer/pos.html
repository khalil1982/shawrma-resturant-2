<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shawrma POS - نقطة البيع</title>
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/pos.css" />
  </head>
  <body>
    <div class="pos-container">
      <!-- Header -->
      <header class="pos-header">
        <div class="pos-header__info">
          <h1>نقطة البيع - شاورما</h1>
          <div id="shiftInfo" class="pos-header__shift">
            <span class="shift-indicator"></span>
            <span id="shiftText">لا توجد وردية نشطة</span>
          </div>
        </div>
        <div class="pos-header__actions">
          <div id="userInfo" class="user-info">جاري التحميل...</div>
          <button id="logoutBtn" class="btn btn--ghost">خروج</button>
        </div>
      </header>

      <!-- Main POS Layout: 3 Columns -->
      <main class="pos-main">
        <!-- Left Column: Menu (Categories + Items) -->
        <section class="pos-menu">
          <div class="pos-menu__header">
            <h2>القائمة</h2>
            <input
              type="text"
              id="menuSearch"
              class="search-input"
              placeholder="بحث..."
            />
          </div>

          <div class="pos-menu__categories" id="categoriesList">
            <!-- Categories will be loaded here -->
          </div>

          <div class="pos-menu__items" id="menuItemsList">
            <!-- Menu items will be loaded here -->
          </div>
        </section>

        <!-- Middle Column: Current Order Items -->
        <section class="pos-order">
          <div class="pos-order__header">
            <h2>الطلب الحالي</h2>
            <button id="clearOrderBtn" class="btn btn--ghost">مسح</button>
          </div>

          <div class="pos-order__items" id="orderItemsList">
            <div class="empty-state">لا توجد أصناف في الطلب</div>
          </div>

          <div class="pos-order__notes">
            <label>
              ملاحظات
              <textarea
                id="orderNotes"
                rows="2"
                placeholder="ملاحظات خاصة بالطلب..."
              ></textarea>
            </label>
          </div>
        </section>

        <!-- Right Column: Order Summary & Checkout -->
        <section class="pos-summary">
          <div class="pos-summary__details">
            <h3>ملخص الطلب</h3>

            <div class="summary-row">
              <label for="orderType">نوع الطلب</label>
              <select id="orderType" class="summary-select">
                <option value="dine_in">محلي</option>
                <option value="takeaway">سفري</option>
              </select>
            </div>

            <div class="summary-row">
              <label for="customerCount">عدد العملاء</label>
              <input
                type="number"
                id="customerCount"
                class="summary-input"
                min="1"
                value="1"
              />
            </div>

            <div class="summary-divider"></div>

            <div class="summary-row">
              <span>المجموع الفرعي</span>
              <span id="subtotalAmount" class="summary-amount">0.00 ر.س</span>
            </div>

            <div class="summary-row">
              <label for="discountPercent">خصم (%)</label>
              <input
                type="number"
                id="discountPercent"
                class="summary-input"
                min="0"
                max="100"
                value="0"
                step="1"
              />
            </div>

            <div class="summary-row">
              <span>قيمة الخصم</span>
              <span id="discountAmount" class="summary-amount">0.00 ر.س</span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-row summary-row--total">
              <span>الإجمالي</span>
              <span id="totalAmount" class="summary-amount">0.00 ر.س</span>
            </div>
          </div>

          <div class="pos-summary__actions">
            <button id="createOrderBtn" class="btn btn--primary btn--large" disabled>
              إنشاء طلب
            </button>
            <button id="cancelBtn" class="btn btn--secondary">إلغاء</button>
          </div>

          <div id="summaryError" class="error hidden"></div>
        </section>
      </main>
    </div>

    <script src="./pos.js"></script>
  </body>
</html>
